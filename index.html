<!DOCTYPE html>
<!--
  قالب لعبة «مَزُون» التعليمية — تصميم وإعداد: أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي (١-٩)
  © أ. عهود العبرية. مرخّص بموجب CC BY-NC-SA 4.0 (https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ar)
  يُسمح بالنسخ والتعديل وإنشاء ألعاب جديدة للأغراض التعليمية غير التجارية، بشرط:
  1) إبقاء اسم المصممة والتذييل والشعار ظاهرة في كل لعبة مشتقة وعدم حذفها أو تغييرها.
  2) الإشارة إلى أن اللعبة مبنية على هذا القالب.
  3) نشر أي لعبة مشتقة بالرخصة نفسها.
  حذف اسم المصممة أو نسبة العمل لغيرها مخالفة لشروط الرخصة.
-->
<html lang="ar" dir="rtl">
<head>
<meta name="author" content="أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي (١-٩)"><meta name="copyright" content="© جميع الحقوق محفوظة لـ أ. عهود العبرية"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>لعبة تعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f4b;--ink2:#2c3490;--coral:#ff6f61;--peach:#ffb48a;--aqua:#27c4d4;--lilac:#9b8cff;--cream:#fff7ee;--ok:#1fbf9a;--bad:#f0566a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0d1236;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a2f7a,#0d1236)}
#stage{position:relative;overflow:hidden;flex:none;direction:rtl;background:#0d1236}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#credit{height:36px;flex:none;display:flex;align-items:center;justify-content:center;font-size:min(19px,3.9vw);font-weight:800;color:#fff;letter-spacing:.2px;text-shadow:0 1px 6px rgba(0,0,0,.45);white-space:nowrap;max-width:100vw}
#loading{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0a84ff,#7cc4ff);color:#fff;font-weight:900;font-size:1.6em}
#loading.hide{display:none}

#hud{position:absolute;top:.7em;left:.8em;right:.8em;z-index:10;display:none}
#hud.on{display:block}
.panel{display:flex;align-items:center;gap:1em;height:3.7em;padding:.4em 1em;background:rgba(var(--hudrgb,22,26,74),.84);color:#fff;border-radius:1.4em;border:1px solid rgba(255,255,255,.18);box-shadow:0 .4em 1.2em rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:.6em;flex:none}
.logo{width:2.5em;height:2.5em;flex:none}
.brand div{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:1.15em;font-weight:900;white-space:nowrap}
.brand small{font-size:.72em;opacity:.8;white-space:nowrap}
.sep{width:1px;height:2.3em;background:rgba(255,255,255,.2);flex:none}
.stn{display:flex;flex-direction:column;line-height:1.15;flex:none;min-width:7em}
.stn small{font-size:.72em;opacity:.8;white-space:nowrap}
.stn b{font-size:1em;font-weight:700;white-space:nowrap}
.stn .no{color:var(--peach);font-weight:900}
.prog{flex:1;min-width:6em;height:.75em;background:rgba(255,255,255,.2);border-radius:1em;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:1em;background:linear-gradient(90deg,#ff6f61,#ffb48a)}
.prog s{position:absolute;top:50%;width:1.5em;height:1.5em;margin:-.75em 0 0 -.75em;border-radius:50%;background:#fff;border:.2em solid var(--coral);left:0}
.stat{display:flex;align-items:center;gap:.4em;flex:none;font-weight:900;font-size:1.15em;direction:ltr;transition:transform .15s}
.stat.pop{transform:scale(1.3)}
.stat svg{width:1.3em;height:1.3em;flex:none}
.stat span{display:block;min-width:1.4em;text-align:left}
.hearts{display:flex;gap:.2em;flex:none;direction:ltr}
.hearts svg{width:1.5em;height:1.5em}
.hearts svg.off{opacity:.28;filter:grayscale(1)}
.ibtn{width:2.5em;height:2.5em;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.ibtn svg{width:1.3em;height:1.3em}
.ibtn.off{opacity:.5}

.notice{position:absolute;top:5.7em;left:50%;z-index:12;transform:translate(-50%,-1em);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center;background:rgba(255,247,238,.95);color:var(--ink);border-radius:1.2em;padding:.5em 1.6em;display:flex;flex-direction:column;box-shadow:0 .4em 1.2em rgba(0,0,0,.25);border:.14em solid var(--coral);max-width:46em}
.notice.show{opacity:1;transform:translate(-50%,0)}
.notice b{font-size:1.35em;font-weight:900}
.notice span{font-size:1em;font-weight:500;opacity:.85}
.notice.station{background:linear-gradient(135deg,#2c3490,#1b1f4b);color:#fff;border-color:var(--peach);padding:.7em 2.4em}
.notice.station b{font-size:1.9em}
.notice.station span{font-size:1.15em;color:var(--peach);opacity:1}

#touch{display:none}
#touch.on{display:block}
.tb{position:absolute;bottom:1em;width:5em;height:5em;border-radius:50%;background:rgba(22,26,74,.55);border:.16em solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:9;touch-action:none}
.tb:active,.tb.down{background:rgba(255,111,97,.75)}
.tb svg{width:2.2em;height:2.2em}
#bl{left:1.2em}#br{left:7em}#bj{right:1.4em;width:5.6em;height:5.6em}
body:not(.touch) #bj{right:auto;left:13.8em;width:5em;height:5em}

.screen{position:absolute;inset:0;display:none;z-index:20}
.screen.on{display:flex}
#modal{align-items:center;justify-content:center;padding-top:4.6em;background:rgba(14,18,60,.55)}
#home{z-index:30;align-items:flex-start;justify-content:center}
.card{background:var(--cream);border-radius:1.8em;padding:1.4em 2.2em;box-shadow:0 1em 3em rgba(0,0,0,.4);border:.16em solid #fff;text-align:center;max-width:52em}
.card.home{margin-top:1.4em;width:44em;background:none;border:0;box-shadow:none;padding:.6em 1em}
.home h1,.home p,.home .hint{color:#fff;text-shadow:0 .05em .1em rgba(6,16,56,.9),0 0 .5em rgba(6,16,56,.75),0 .1em 1em rgba(6,16,56,.6)}
.home h1{font-size:3.6em}.home p{opacity:1;font-weight:700;font-size:1.3em}.home .hint{opacity:.95;font-weight:500}
.home .mk{display:flex;align-items:center;justify-content:center;gap:.7em}
.home .mk svg{width:3.2em;height:3.2em}
.home h1{font-weight:900;line-height:1.15}
.home p{margin:.6em 0 1em}

.card.mapc{display:flex;flex-direction:row;gap:1.1em;padding:.9em;text-align:right;align-items:stretch;max-width:none;width:62em;height:37.6em}
.mapc .mw{flex:none;height:100%;aspect-ratio:856/960;border-radius:1.1em;overflow:hidden;background:#8fe0ea;border:.14em solid #fff;box-shadow:0 .2em .8em rgba(27,31,75,.25)}
.mapc canvas{width:100%;height:100%;display:block;touch-action:none}
.mapc .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:.75em;justify-content:center}
.mapc .chip{align-self:flex-start}
.mapc .mtask{font-size:1.4em;line-height:1.6;color:var(--ink);font-weight:900}
.mapc .mroute{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .35em;font-size:.95em;font-weight:700}
.mapc .mroute span{background:#e8e2f7;color:#7a72ad;border-radius:2em;padding:.15em .8em;transition:.25s}
.mapc .mroute span.on{background:var(--ok);color:#fff}
.mapc .mroute i{font-style:normal;color:#9b8cff;font-weight:900}
.mapc .mstat{background:#fff;border-radius:1em;padding:.7em 1em;font-weight:800;font-size:1.05em;line-height:1.6;border:.12em solid #e8e2f7;min-height:4.2em;display:flex;align-items:center}
.mapc .mstat.ok{background:#e0f8f1;border-color:var(--ok);color:#0f7a63}
.mapc .mstat.bad{background:#ffe9ec;border-color:var(--bad);color:#b3283c}
.mapc .mtools{display:flex;gap:.5em;align-items:center}
.mapc .tl{font:inherit;font-weight:900;font-size:1.25em;width:2em;height:2em;border-radius:50%;border:.1em solid #c9c2ea;background:#fff;color:var(--ink2);cursor:pointer;line-height:1}
.mapc .tl.wide{width:auto;border-radius:2em;padding:0 1.1em;font-size:1em;height:2.3em}
.mapc .mhint{display:flex;align-items:center;gap:.5em;font-size:.92em;font-weight:700;color:var(--ink2)}
.btn{display:inline-block;border:0;font:inherit;font-weight:900;font-size:1.6em;color:#fff;background:linear-gradient(180deg,var(--btn1,#ff8a6e),var(--coral));padding:.45em 2.2em;border-radius:2em;box-shadow:0 .25em 0 var(--btnS,#c93a4b),0 .6em 1.2em rgba(0,0,0,.25);cursor:pointer}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 var(--btnS,#c93a4b)}
.btn.soft{background:linear-gradient(180deg,var(--soft1,#6d7bf0),var(--ink2));box-shadow:0 .25em 0 var(--softS,#2a3290),0 .6em 1.2em rgba(0,0,0,.25);font-size:1.25em;margin:0 .3em}
#homeStart{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.home .hint{font-size:.95em;margin-top:.9em;opacity:.75;font-weight:500}

.q{width:46em}
.chip{display:inline-block;background:var(--chipbg,#e8e2f7);color:var(--ink2);border-radius:2em;padding:.2em 1.1em;font-weight:700;font-size:.95em}
.chip b{font-weight:900}
.tmr{display:flex;align-items:center;gap:.6em;margin:.9em auto .1em;direction:ltr;max-width:22em}.trk{flex:1;height:.6em;border-radius:1em;background:#e7e1d3;overflow:hidden}.tmr i{display:block;height:100%;width:100%;border-radius:1em;background:linear-gradient(90deg,var(--ok),var(--coral));transition:width .12s linear}.tmr b{unicode-bidi:isolate;font-size:1em;font-weight:900;color:var(--ink2);min-width:3em;text-align:center}
.qimg{display:block;margin:0 auto .7em;max-height:13.5em;max-width:100%;border-radius:.6em;box-shadow:0 .2em .7em rgba(0,0,0,.25);border:.12em solid var(--ink2)}
.idc{margin:0 auto .8em;max-width:26em;background:#fff;border:.14em solid var(--ink2);border-radius:1.4em;padding:.5em 1.2em;box-shadow:.2em .25em 0 var(--ink2)}
.idc p{font-size:1.2em;font-weight:800;padding:.25em 0}.idc p:before{content:'• ';color:var(--coral)}
.qt{font-size:1.75em;font-weight:900;margin:.6em 0 .8em;line-height:1.5}
.qt.long{font-size:1.4em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
.opts.o3{grid-template-columns:repeat(3,1fr)}.opts.o3 .opt{font-size:1.12em;min-height:4em;text-align:center;line-height:1.5}
.opt{display:flex;align-items:center;justify-content:center;gap:.5em;min-height:3.4em;border:.15em solid var(--optb,#d6cff0);background:#fff;border-radius:1.1em;font:inherit;font-size:1.3em;font-weight:700;color:var(--ink);padding:.5em .8em;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.97)}
.opt.ok{background:#d6f8ee;border-color:var(--ok);color:#0b6e58}
.opt.bad{background:#ffe1e6;border-color:var(--bad);color:#a02539}
.opt.dim{opacity:.45}
.opts.lock .opt{pointer-events:none}
.src{margin-top:.9em;font-size:.85em;opacity:.65}
.res h2{font-size:2.2em;font-weight:900}
.res p{font-size:1.3em;margin:.4em 0 1em;font-weight:700}
.stars{display:flex;justify-content:center;gap:.4em;margin:.4em 0}
.stars svg{width:4em;height:4em}
.bar{height:.5em;border-radius:1em;background:var(--chipbg,#e8e2f7);margin-top:1em;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);animation:fill 2.2s linear forwards}
@keyframes fill{to{width:100%}}
#rotate{position:fixed;inset:0;background:#0d1236;color:#fff;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1em;font-size:20px;font-weight:700;text-align:center;padding:2em}
#rotate svg{width:80px;height:80px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#wm{position:absolute;left:50%;transform:translateX(-50%);bottom:.4em;white-space:nowrap;z-index:60;pointer-events:none;font-size:.8em;font-weight:700;color:rgba(255,255,255,.55);text-shadow:0 0 .3em rgba(0,0,0,.7);direction:rtl}
.card.res:after,.card.q:after{content:'© أ. عهود العبرية';display:block;margin-top:.7em;font-size:.7em;font-weight:700;opacity:.45}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud"><div class="panel">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#ff6f61"/><path d="M20 7c5 7 9 11 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z" fill="#fff"/><path d="M16 24a4 4 0 0 0 4 4" stroke="#27c4d4" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <div><b id="gTitle"></b><small id="gSub"></small></div>
    </div>
    <div class="sep"></div>
    <div class="stn"><small>المرحلة <bdi dir="ltr" class="no" id="stNum">1</bdi></small><b id="stTopic"></b></div>
    <div class="prog" dir="ltr"><i id="progFill"></i><s id="progMark"></s></div>
    <div class="stat" title="النقاط"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffb48a"/></svg><span id="vPts">0</span></div>
    <div class="stat" id="coinStat" title="العملات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc72c" stroke="#c98200" stroke-width="2"/><path d="M12 6.5l1.6 3.4 3.7.4-2.8 2.5.8 3.7-3.3-1.9-3.3 1.9.8-3.7-2.8-2.5 3.7-.4z" fill="#e49a00"/></svg><span id="vCoins">0</span></div>
    <div class="hearts" id="hearts" title="الأرواح"></div>
    <button class="ibtn" id="btnSound" aria-label="الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="ibtn" id="btnPause" aria-label="إيقاف مؤقت"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  </div></div>

  <div id="notice" class="notice"></div>

  <div id="touch">
    <div class="tb" id="bl"><svg viewBox="0 0 24 24" fill="#fff"><path d="M15 4v16L5 12z"/></svg></div>
    <div class="tb" id="br"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 4v16l10-8z"/></svg></div>
    <div class="tb" id="bj"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 4l8 10h-5v6H9v-6H4z"/></svg></div>
  </div>

  <div id="home" class="screen on">
    <div class="card home">
      <div class="mk"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#ff6f61"/><path d="M20 7c5 7 9 11 9 16a9 9 0 0 1-18 0c0-5 4-9 9-16z" fill="#fff"/><path d="M16 24a4 4 0 0 0 4 4" stroke="#27c4d4" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><h1 id="hTitle"></h1></div>
      <p id="hSub"></p>
      <button class="btn" id="homeStart">ابدأ المغامرة</button>
      <div class="hint">الحركة بالأسهم، والقفز بمفتاح المسافة. وعلى الأجهزة اللوحية استخدم الأزرار على الشاشة.</div>
    </div>
  </div>

  <div id="modal" class="screen"></div>
  <div id="loading">جارٍ تحضير الرحلة…</div>
 </div>
 <div id="credit">إعداد : أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي (١-٩)</div>
</div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><div>أدر الجهاز إلى الوضع الأفقي لبدء اللعب</div></div>

<script src="settings.js"></script>
<script src="assets.js"></script>
<script src="engine.js"></script>
</body>
</html>
